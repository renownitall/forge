name: "Stage Site"
description: "Copies web/ over the publish directory and cache-busts asset URLs per commit"
runs:
  using: "composite"
  steps:
    - name: Copy site and bust caches
      shell: bash
      env:
        SHORT_SHA: ${{ github.sha }}
      run: |
        mkdir -p repo
        cp -R "$GITHUB_WORKSPACE/web/." repo/

        short_sha="${SHORT_SHA:0:7}"
        sed -i "s|styles.css|styles.css?v=${short_sha}|; s|app.js|app.js?v=${short_sha}|" repo/index.html
        sed -i "s|styles.css|styles.css?v=${short_sha}|" repo/404.html
        sed -i "s|packages.json|packages.json?v=${short_sha}|" repo/app.js

        echo "Staged site contents:"
        ls -lah repo
