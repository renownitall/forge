name: Build Arch Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "web/**"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

env:
  REPO_NAME: forge
  PAGES_URL: https://renownitall.github.io/forge

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_packages: ${{ steps.set-matrix.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: set-matrix
        run: |
          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          if [ -z "$ALL_PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages found in repository"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              PACKAGES="$ALL_PACKAGES"
            else
              CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- packages/ | cut -d/ -f2 | sort -u)
              PACKAGES=""
              for pkg in $CHANGED; do
                if echo "$ALL_PACKAGES" | grep -qx "$pkg"; then
                  PACKAGES="$PACKAGES $pkg"
                fi
              done
            fi

            # Empty commit with ci(rebuild): <pkg> triggers a single-package rebuild.
            if [ -z "$PACKAGES" ]; then
              MSG=$(git log -1 --format=%s ${{ github.sha }})
              if [[ "$MSG" =~ ^ci\(rebuild\):[[:space:]]+(.+)$ ]]; then
                TARGET="${BASH_REMATCH[1]}"
                if echo "$ALL_PACKAGES" | grep -qx "$TARGET"; then
                  PACKAGES="$TARGET"
                fi
              fi
            fi
          else
            PACKAGES="$ALL_PACKAGES"
          fi

          PACKAGES=$(echo "$PACKAGES" | xargs)

          if [ -z "$PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages to build"
          else
            JSON=$(echo "$PACKAGES" | tr ' ' '\n' | jq -R . | jq -sc '{package: .}')
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "Building: $PACKAGES"
          fi

  build:
    needs: changed-packages
    if: needs.changed-packages.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-packages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build user
        run: |
          # Create user before caching to ensure correct directory ownership
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chown -R builder:builder /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chmod 700 /home/builder/.gnupg

      - name: Check if package needs Rust
        id: check-rust
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # Enabling the cache is a pure optimization, so the match is
          # intentionally broad: word-level search over the whole PKGBUILD,
          # which also covers multi-line array entries (e.g. makedepends with
          # one 'cargo'/'rust' per line) that line-anchored regexes miss.
          if grep -qE '\b(cargo|rustc|rustup|rust)\b' "packages/$PACKAGE/PKGBUILD"; then
            echo "needs_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            pacman-${{ matrix.package }}-
            pacman-

      - name: Cache Rust/Cargo artifacts
        if: steps.check-rust.outputs.needs_rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cargo-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            cargo-${{ matrix.package }}-
            cargo-

      - name: Setup build environment
        run: |
          # Mirrors are occasionally flaky; retry the package manager steps so
          # a single transient mirror/network failure does not fail every
          # package for the day.
          retry() {
            local attempt=1
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 3 ]; then
                echo "::error::Command failed after 3 attempts: $*"
                return 1
              fi
              echo "::warning::Command failed (attempt $((attempt - 1))/3), retrying in 10s: $*"
              sleep 10
            done
          }

          pacman-key --init
          pacman-key --populate archlinux
          retry pacman -Syu --noconfirm --noprogressbar
          retry pacman -S --noconfirm --needed --noprogressbar git mold pacman-contrib

          sed -i 's/-march=x86-64 -mtune=generic/-march=x86-64-v3/g' /etc/makepkg.conf
          sed -i '/^OPTIONS=/s/!lto/lto/' /etc/makepkg.conf
          sed -i '/^OPTIONS=/s/ debug / !debug /' /etc/makepkg.conf
          sed -i 's/-mno-omit-leaf-frame-pointer"/-mno-omit-leaf-frame-pointer -mpclmul"/' /etc/makepkg.conf
          sed -i 's/LTOFLAGS="-flto=auto"/LTOFLAGS="-flto=auto -falign-functions=32"/' /etc/makepkg.conf

          NPROC=$(nproc)
          sed -i "s/#MAKEFLAGS=\"-j2\"/MAKEFLAGS=\"-j${NPROC}\"/" /etc/makepkg.conf

          cat >> /etc/makepkg.conf <<'EOF'
          RUSTFLAGS="-Cforce-frame-pointers=yes -Copt-level=3 -Ctarget-cpu=x86-64-v3 -Clink-arg=-z -Clink-arg=pack-relative-relocs -Ccodegen-units=1 -Clink-arg=-fuse-ld=mold"
          export CARGO_PROFILE_RELEASE_LTO=fat
          EOF

          sed -i "s/COMPRESSZST=(zstd -c -z -q -)/COMPRESSZST=(zstd -c -z -q --threads=0 -19 -)/" /etc/makepkg.conf

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: builder

      - name: Build ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$GITHUB_WORKSPACE/packages/$PACKAGE"
          su builder -c "makepkg -s --sign --noconfirm --noprogressbar --cleanbuild"

      - name: Verify package was built
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          ls packages/$PACKAGE/*.pkg.tar.zst
          ls packages/$PACKAGE/*.pkg.tar.zst.sig

      - name: Stage packages for artifact upload
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          stage="$GITHUB_WORKSPACE/artifact-stage"
          src="$GITHUB_WORKSPACE/packages/$PACKAGE"
          mkdir -p "$stage"
          shopt -s nullglob
          files=( "$src"/*.pkg.tar.zst "$src"/*.pkg.tar.zst.sig )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package files in $src"
            exit 1
          fi
          tar -C "$src" -cf "$stage/pkg.tar" -- "${files[@]##*/}"
          tar -tf "$stage/pkg.tar"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: artifact-stage/pkg.tar
          if-no-files-found: error
          retention-days: 3

      - name: Clean pacman cache
        if: always()
        # Keep the last 2 versions per package: the pacman cache is restored
        # by actions/cache on subsequent runs, and -k 0 would wipe it before
        # the save step, making the cache permanently empty.
        run: paccache -r -u -k 2 || true

  repo:
    needs: [changed-packages, build]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repo tools
        run: |
          # Mirrors are occasionally flaky; retry so a single transient
          # mirror/network failure does not block the repository update.
          retry() {
            local attempt=1
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 3 ]; then
                echo "::error::Command failed after 3 attempts: $*"
                return 1
              fi
              echo "::warning::Command failed (attempt $((attempt - 1))/3), retrying in 10s: $*"
              sleep 10
            done
          }

          pacman-key --init
          pacman-key --populate archlinux
          # repo-add ships with pacman; jq formats the package manifest.
          retry pacman -Syu --noconfirm --noprogressbar jq

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: root

      - name: Download all package artifacts
        if: needs.changed-packages.outputs.has_packages == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Fetch existing repository packages
        run: |
          mkdir -p repo
          cp signing_key.asc repo/

          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          debug_opted_in() {
            opts=$(tr -d '\n' < "packages/$1/PKGBUILD" \
              | grep -oE 'options\+?=\([^)]*\)' \
              | sed -E 's/^options\+?=//' \
              | tr -d "()'\"" | tr -s ' ')
            echo "$opts" | tr ' ' '\n' | grep -qx 'debug'
          }

          echo "Fetching existing repo file index from ${PAGES_URL}..."
          HTTP_CODE=$(curl -sSL --connect-timeout 15 --max-time 60 \
            -o /tmp/files.tar.gz -w '%{http_code}' \
            "${PAGES_URL}/${REPO_NAME}.files.tar.gz")

          : > /tmp/published.tsv
          if [ "$HTTP_CODE" = "200" ]; then
            tar -xzOzf /tmp/files.tar.gz --wildcards '*/desc' \
              | awk '
                  /^%FILENAME%$/ {
                    if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn
                    name=""; base=""; fn=""; getline; fn=$0; next
                  }
                  /^%NAME%$/     { getline; name=$0; next }
                  /^%BASE%$/     { getline; base=$0; next }
                  END            { if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn }
                ' | sort -u > /tmp/published.tsv
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "  No existing repo found at ${PAGES_URL} (first deploy?)."
          else
            echo "::error::Failed to fetch existing repo index (HTTP ${HTTP_CODE}); aborting to avoid wiping published packages"
            exit 1
          fi

          if [ -s /tmp/published.tsv ]; then
            while IFS=$'\t' read -r name base fn; do
              keep=1; reason=""
              if ! echo "$ALL_PACKAGES" | grep -qx "$base"; then
                keep=0; reason="base '${base}' no longer in packages/"
              elif [ -d "artifacts/$base" ]; then
                keep=0; reason="rebuilt this run, dropping previously published '${name}'"
              elif [ "$name" = "${base}-debug" ]; then
                if ! debug_opted_in "$base"; then
                  keep=0; reason="debug disabled globally, '${base}' does not opt in"
                fi
              fi
              if [ "$keep" != "1" ]; then
                echo "  Prune     $fn  ($reason)"
                continue
              fi
              [ -f "repo/$fn" ] && continue
              echo "  Fetching $fn..."
              curl -fsSL --connect-timeout 15 --max-time 120 \
                "${PAGES_URL}/${fn}"     -o "repo/$fn"     \
                || echo "    WARN: $fn missing on Pages, will be dropped from DB"
              curl -fsSL --connect-timeout 15 --max-time 30 \
                "${PAGES_URL}/${fn}.sig" -o "repo/$fn.sig" \
                || echo "    WARN: $fn.sig missing on Pages"
            done < /tmp/published.tsv
          fi

      - name: Build repository database
        run: |
          cd repo

          if [ -d ../artifacts ]; then
            find ../artifacts/ -name pkg.tar -exec tar -xf {} \;
            find ../artifacts/ -name "*.pkg.tar.zst"     -exec mv {} . \;
            find ../artifacts/ -name "*.pkg.tar.zst.sig" -exec mv {} . \;
          fi

          pkg_count=$(ls -1 *.pkg.tar.zst 2>/dev/null | wc -l)
          echo "Found ${pkg_count} package(s) total (existing + new):"
          ls -1 *.pkg.tar.zst | sed 's/^/  /'
          if [ "$pkg_count" -eq 0 ]; then
            echo "::error::No packages found to build repository"
            exit 1
          fi

          repo-add --remove --sign "${REPO_NAME}.db.tar.gz" *.pkg.tar.zst

          for link in "${REPO_NAME}.db" "${REPO_NAME}.db.sig" "${REPO_NAME}.files" "${REPO_NAME}.files.sig"; do
            if [ -L "$link" ]; then
              target=$(readlink "$link")
              rm "$link"
              cp "$target" "$link"
            fi
          done

          echo "Repository contents:"
          ls -lah

      - name: Generate package manifest and stage site
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          cd repo

          tar -xzOzf "${REPO_NAME}.db.tar.gz" --wildcards '*/desc' \
            | awk '
                function emit() {
                  if (name != "") print name "\t" base "\t" ver "\t" desc "\t" csize "\t" bdate
                }
                /^%FILENAME%$/  { emit(); next }
                /^%NAME%$/      { getline; name=$0; next }
                /^%BASE%$/      { getline; base=$0; next }
                /^%VERSION%$/   { getline; ver=$0; next }
                /^%DESC%$/      { getline; desc=$0; next }
                /^%CSIZE%$/     { getline; csize=$0; next }
                /^%BUILDDATE%$/ { getline; bdate=$0; next }
                END { emit() }
              ' \
            | LC_ALL=C sort \
            | jq -R 'split("\t") | {
                name: .[0],
                base: .[1],
                version: .[2],
                description: .[3],
                size: (.[4] | tonumber),
                built: (.[5] | tonumber)
              }' \
            | jq -s '{packages: .}' \
            > packages.json

          cp -R "$GITHUB_WORKSPACE/web/." .

          short_sha="${SHORT_SHA:0:7}"
          sed -i "s|styles.css|styles.css?v=${short_sha}|; s|app.js|app.js?v=${short_sha}|" index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/

  deploy:
    needs: repo
    # Default gating requires all transitive needs to succeed, so a skipped
    # build (no package changes) would skip the deploy of a site-only edit.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

