name: Build Arch Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

env:
  REPO_NAME: forge
  PAGES_BASE: https://renownitall.github.io/forge

permissions: {}

# `shell: bash` gives every `run:` step `-o pipefail`. The default
# `bash -e {0}` drops it, so a mid-pipeline failure goes unnoticed.
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push rebuilds only what its diff touched. The daily run and a manual
  # dispatch rebuild everything, which keeps git packages moving with upstream
  # without an upstream probe. The database is rebuilt from scratch, and a
  # package leaves the repo by leaving packages/ or by gaining a HOLD file.
  discover:
    runs-on: ubuntu-latest
    # Gate publishing on main because workflow_dispatch can start from any ref.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_packages: ${{ steps.select.outputs.has_packages }}
      has_removals: ${{ steps.select.outputs.has_removals }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diffing against the previous commit needs the full history.
          fetch-depth: 0

      - name: Select packages
        id: select
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: .github/scripts/select-packages.py

      - name: Upload published copies
        if: steps.select.outputs.staged == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-copies
          path: staging/pkg.tar
          if-no-files-found: error
          retention-days: 3

  build:
    needs: discover
    # Skips when the run selects no packages, which covers docs-only pushes
    # and a full HOLD pause.
    if: needs.discover.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
      options: --user root
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build user
        run: |
          # Create user before caching to ensure correct directory ownership
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chown -R builder:builder /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chmod 700 /home/builder/.gnupg

      - name: Check if package needs Rust
        id: check-rust
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # The cache is a pure optimization, so the match stays broad over
          # the whole file to cover multi-line array entries.
          if grep -qE '\b(cargo|rustc|rustup|rust)\b' "packages/$PACKAGE/PKGBUILD"; then
            echo "needs_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            pacman-${{ matrix.package }}-
            pacman-

      - name: Cache Rust/Cargo artifacts
        if: steps.check-rust.outputs.needs_rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cargo-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            cargo-${{ matrix.package }}-
            cargo-

      - name: Setup build environment
        run: .github/scripts/setup-build-env.sh

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: builder

      - name: Build ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$GITHUB_WORKSPACE/packages/$PACKAGE"
          su builder -c "makepkg -s --sign --noconfirm --noprogressbar --cleanbuild"

      - name: Verify package was built
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          ls packages/$PACKAGE/*.pkg.tar.zst
          ls packages/$PACKAGE/*.pkg.tar.zst.sig

      - name: Stage packages for artifact upload
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          stage="$GITHUB_WORKSPACE/artifact-stage"
          src="$GITHUB_WORKSPACE/packages/$PACKAGE"
          mkdir -p "$stage"
          shopt -s nullglob
          files=( "$src"/*.pkg.tar.zst "$src"/*.pkg.tar.zst.sig )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package files in $src"
            exit 1
          fi
          tar -C "$src" -cf "$stage/pkg.tar" -- "${files[@]##*/}"
          tar -tf "$stage/pkg.tar"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: artifact-stage/pkg.tar
          if-no-files-found: error
          retention-days: 3

      - name: Clean pacman cache
        if: always()
        # Keep two versions. actions/cache restores this directory on later
        # runs, and -k 0 would wipe it before the save step, leaving the
        # cache permanently empty.
        run: paccache -r -u -k 2 || true

  # Nothing is installed in this job. The pinned archlinux:base image already
  # has gpg, and repo-add --sign works without pacman-key. The always() guard
  # lets a run with no builds publish a removal, while a failed build blocks
  # the publish entirely.
  repo:
    needs: [discover, build]
    if: ${{ always() && !cancelled() && needs.build.result != 'failure' && (needs.discover.outputs.has_packages == 'true' || needs.discover.outputs.has_removals == 'true') }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: root

      - name: Verify the signing key matches what users are told to trust
        run: |
          set -euo pipefail
          secret_fp=$(gpg --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}' || true)
          show_home=$(mktemp -d)
          published_fp=$(GNUPGHOME="$show_home" gpg --with-colons --show-keys signing_key.asc 2>/dev/null | awk -F: '$1=="fpr" {print $10; exit}' || true)
          if [ "$secret_fp" != "$published_fp" ]; then
            echo "::error::CI signs with $secret_fp but signing_key.asc is $published_fp. Republish the key"
            exit 1
          fi
          if ! grep -q "$secret_fp" README.md; then
            echo "::error::README.md does not tell users to lsign the signing key ($secret_fp)"
            exit 1
          fi
          echo "Signing key $secret_fp: matches signing_key.asc and README.md"

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Build repository database
        run: .github/scripts/build-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/

  deploy:
    needs: repo
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
