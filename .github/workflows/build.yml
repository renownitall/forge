name: Build Arch Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/actions/**"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      check_upstream:
        description: "Only rebuild -git packages whose upstream moved past what is published"
        type: boolean
        default: false
  schedule:
    - cron: "37 4 * * *"

env:
  REPO_NAME: forge
  PAGES_URL: https://renownitall.github.io/forge

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_packages: ${{ steps.set-matrix.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: set-matrix
        run: |
          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          if [ -z "$ALL_PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages found in repository"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              PACKAGES="$ALL_PACKAGES"
            else
              # Handle force-pushes where before is orphaned and not fetched
              # (e.g. amended commits). Fall back to HEAD~1 diff if needed.
              if ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
                echo "::warning::before SHA ${{ github.event.before }} not found locally, attempting to fetch"
                git fetch origin "${{ github.event.before }}" --depth=1 2>/dev/null || true
              fi
              if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
                CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- packages/ | cut -d/ -f2 | sort -u)
              else
                echo "::warning::before SHA still not found, falling back to HEAD~1 diff"
                CHANGED=$(git diff --name-only HEAD~1 HEAD -- packages/ 2>/dev/null | cut -d/ -f2 | sort -u || true)
              fi
              PACKAGES=""
              for pkg in $CHANGED; do
                if echo "$ALL_PACKAGES" | grep -qx "$pkg"; then
                  PACKAGES="$PACKAGES $pkg"
                fi
              done
            fi

            # Empty commit with ci(rebuild): <pkg> triggers a single-package rebuild.
            if [ -z "$PACKAGES" ]; then
              MSG=$(git log -1 --format=%s ${{ github.sha }})
              if [[ "$MSG" =~ ^ci\(rebuild\):[[:space:]]+(.+)$ ]]; then
                TARGET="${BASH_REMATCH[1]}"
                if echo "$ALL_PACKAGES" | grep -qx "$TARGET"; then
                  PACKAGES="$TARGET"
                fi
              fi
            fi
          else
            # Scheduled runs rebuild -git packages only when upstream moved
            # past what is already published. Manual runs opt in via input.
            FILTER="false"
            CANDIDATES="$ALL_PACKAGES"
            if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.check_upstream }}" == "true" ]]; then
              FILTER="true"
              CANDIDATES=$(echo "$ALL_PACKAGES" | grep -E -- '-git$' || true)
            fi

            PACKAGES="$CANDIDATES"

            if [[ "$FILTER" == "true" ]]; then
              # The published manifest records what users currently have.
              # If it is unavailable the filter below fails open and keeps
              # every candidate, preserving today's rebuild-all behavior.
              PUBLISHED="/tmp/published-packages.json"
              if ! curl -fsSL --connect-timeout 15 --max-time 60 -o "$PUBLISHED" "${PAGES_URL}/packages.json"; then
                echo "::warning::Could not fetch published manifest; rebuilding all -git candidates"
                rm -f "$PUBLISHED"
              fi

              KEEP=""
              for pkg in $CANDIDATES; do
                # Revision baked into the published package, e.g.
                # 0.0.0.r16.gcdef1c8-1 -> cdef1c8 or r7135.8775477-1 -> 8775477
                version=$(jq -r --arg base "$pkg" \
                  '.packages[] | select(.base == $base) | .version // empty' \
                  "$PUBLISHED" 2>/dev/null || true)
                published_sha=""
                if [ -n "$version" ]; then
                  version="${version%-*}"
                  last="${version##*.}"
                  last="${last#g}"
                  case "$last" in
                    *[!0-9a-f]*|"") published_sha="" ;;
                    [0-9a-f]*) [ "${#last}" -ge 7 ] && [ "${#last}" -le 40 ] && published_sha="$last" ;;
                  esac
                fi

                if [ -z "$published_sha" ]; then
                  echo "  Build $pkg (not published or no git revision in '$version')"
                  KEEP="$KEEP $pkg"
                  continue
                fi

                # Unpinned git source URLs; pinned ones (#commit=/#tag=) can
                # only change via a PKGBUILD push, which has its own path.
                sources=$(
                  cd "packages/$pkg" || exit
                  source ./PKGBUILD
                  printf '%s\n' "${source[@]}"
                ) || { echo "  Build $pkg (could not read PKGBUILD)"; KEEP="$KEEP $pkg"; continue; }

                urls=$(printf '%s\n' "$sources" \
                  | awk -F'git\\+' '$2 {print $2}' \
                  | grep -vE '#(commit|tag)=' ) || true
                url_count=$(printf '%s' "$urls" | grep -c . || true)

                if [ "$url_count" != "1" ]; then
                  echo "  Build $pkg (expected 1 unpinned git source, found $url_count)"
                  KEEP="$KEEP $pkg"
                  continue
                fi
                url=$(printf '%s\n' "$urls" | head -n1)

                ref="HEAD"
                case "$url" in *'#branch='*) ref="refs/heads/${url##*#branch=}";; esac
                url="${url%%#*}"

                remote_sha=""
                attempt=1
                while [ "$attempt" -le 3 ] && [ -z "$remote_sha" ]; do
                  remote_sha=$(git ls-remote "$url" "$ref" 2>/dev/null | awk '{print $1; exit}') || remote_sha=""
                  if [ -n "$remote_sha" ]; then break; fi
                  if [ "$attempt" -lt 3 ]; then sleep 10; fi
                  attempt=$((attempt + 1))
                done
                if [ -z "$remote_sha" ]; then
                  echo "  Build $pkg (ls-remote failed after 3 attempts)"
                  KEEP="$KEEP $pkg"
                  continue
                fi

                if [[ "$remote_sha" == "$published_sha"* ]]; then
                  echo "  Skip  $pkg (upstream ${remote_sha:0:7} matches published $published_sha)"
                else
                  echo "  Build $pkg (upstream ${remote_sha:0:7} != published $published_sha)"
                  KEEP="$KEEP $pkg"
                fi
              done

              PACKAGES=$(echo "$KEEP" | xargs)
            fi
          fi

          PACKAGES=$(echo "$PACKAGES" | xargs)

          if [ -z "$PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages to build"
          else
            JSON=$(echo "$PACKAGES" | tr ' ' '\n' | jq -R . | jq -sc '{package: .}')
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "Building: $PACKAGES"
          fi

  build:
    needs: changed-packages
    if: needs.changed-packages.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:aecf5b39bd3139a951090dfb3d940f9317e4c5fca038c65fb49ac03910f7133e
      options: --user root
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-packages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build user
        run: |
          # Create user before caching to ensure correct directory ownership
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chown -R builder:builder /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chmod 700 /home/builder/.gnupg

      - name: Check if package needs Rust
        id: check-rust
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # Enabling the cache is a pure optimization, so the match is
          # intentionally broad: word-level search over the whole PKGBUILD,
          # which also covers multi-line array entries (e.g. makedepends with
          # one 'cargo'/'rust' per line) that line-anchored regexes miss.
          if grep -qE '\b(cargo|rustc|rustup|rust)\b' "packages/$PACKAGE/PKGBUILD"; then
            echo "needs_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            pacman-${{ matrix.package }}-
            pacman-

      - name: Cache Rust/Cargo artifacts
        if: steps.check-rust.outputs.needs_rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cargo-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            cargo-${{ matrix.package }}-
            cargo-

      - name: Setup build environment
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          .github/scripts/retry.sh pacman -Syu --noconfirm --noprogressbar
          .github/scripts/retry.sh pacman -S --noconfirm --needed --noprogressbar git mold pacman-contrib

          sed -i 's/-march=x86-64 -mtune=generic/-march=x86-64-v3/g' /etc/makepkg.conf
          sed -i '/^OPTIONS=/s/!lto/lto/' /etc/makepkg.conf
          sed -i '/^OPTIONS=/s/ debug / !debug /' /etc/makepkg.conf
          sed -i 's/-mno-omit-leaf-frame-pointer"/-mno-omit-leaf-frame-pointer -mpclmul"/' /etc/makepkg.conf
          sed -i 's/LTOFLAGS="-flto=auto"/LTOFLAGS="-flto=auto -falign-functions=32"/' /etc/makepkg.conf

          NPROC=$(nproc)
          sed -i "s/#MAKEFLAGS=\"-j2\"/MAKEFLAGS=\"-j${NPROC}\"/" /etc/makepkg.conf

          cat >> /etc/makepkg.conf <<'EOF'
          RUSTFLAGS="-Cforce-frame-pointers=yes -Copt-level=3 -Ctarget-cpu=x86-64-v3 -Clink-arg=-z -Clink-arg=pack-relative-relocs -Ccodegen-units=1 -Clink-arg=-fuse-ld=mold"
          export CARGO_PROFILE_RELEASE_LTO=fat
          EOF

          sed -i "s/COMPRESSZST=(zstd -c -z -q -)/COMPRESSZST=(zstd -c -z -q --threads=0 -19 -)/" /etc/makepkg.conf

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: builder

      - name: Build ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd "$GITHUB_WORKSPACE/packages/$PACKAGE"
          su builder -c "makepkg -s --sign --noconfirm --noprogressbar --cleanbuild"

      - name: Verify package was built
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          ls packages/$PACKAGE/*.pkg.tar.zst
          ls packages/$PACKAGE/*.pkg.tar.zst.sig

      - name: Stage packages for artifact upload
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          stage="$GITHUB_WORKSPACE/artifact-stage"
          src="$GITHUB_WORKSPACE/packages/$PACKAGE"
          mkdir -p "$stage"
          shopt -s nullglob
          files=( "$src"/*.pkg.tar.zst "$src"/*.pkg.tar.zst.sig )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No package files in $src"
            exit 1
          fi
          tar -C "$src" -cf "$stage/pkg.tar" -- "${files[@]##*/}"
          tar -tf "$stage/pkg.tar"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package }}
          path: artifact-stage/pkg.tar
          if-no-files-found: error
          retention-days: 3

      - name: Clean pacman cache
        if: always()
        # Keep the last 2 versions per package: the pacman cache is restored
        # by actions/cache on subsequent runs, and -k 0 would wipe it before
        # the save step, making the cache permanently empty.
        run: paccache -r -u -k 2 || true

  repo:
    needs: [changed-packages, build]
    if: ${{ !cancelled() && !failure() && needs.changed-packages.outputs.has_packages == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base@sha256:bf88f8143c3ef21b14d0ebb8140099f0bf75ecfc3699f357ff92317a73f5aba9
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install repo tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          # repo-add ships with pacman; jq formats the package manifest.
          .github/scripts/retry.sh pacman -Syu --noconfirm --noprogressbar jq

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: root

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Fetch existing repository packages
        uses: ./.github/actions/fetch-repo
        with:
          pages-url: ${{ env.PAGES_URL }}
          repo-name: ${{ env.REPO_NAME }}

      - name: Build repository database
        run: |
          cd repo

          if [ -d ../artifacts ]; then
            find ../artifacts/ -name pkg.tar -exec tar -xf {} \;
            find ../artifacts/ -name "*.pkg.tar.zst"     -exec mv {} . \;
            find ../artifacts/ -name "*.pkg.tar.zst.sig" -exec mv {} . \;
          fi

          pkg_count=$(ls -1 *.pkg.tar.zst 2>/dev/null | wc -l)
          echo "Found ${pkg_count} package(s) total (existing + new):"
          ls -1 *.pkg.tar.zst | sed 's/^/  /'
          if [ "$pkg_count" -eq 0 ]; then
            echo "::error::No packages found to build repository"
            exit 1
          fi

          repo-add --remove --sign "${REPO_NAME}.db.tar.gz" *.pkg.tar.zst

          for link in "${REPO_NAME}.db" "${REPO_NAME}.db.sig" "${REPO_NAME}.files" "${REPO_NAME}.files.sig"; do
            if [ -L "$link" ]; then
              target=$(readlink "$link")
              rm "$link"
              cp "$target" "$link"
            fi
          done

          echo "Repository contents:"
          ls -lah

      - name: Generate package manifest
        run: |
          cd repo

          tar -xzOzf "${REPO_NAME}.db.tar.gz" --wildcards '*/desc' \
            | awk '
                function emit() {
                  if (name != "") print name "\t" base "\t" ver "\t" desc "\t" csize "\t" bdate
                }
                /^%FILENAME%$/  { emit(); next }
                /^%NAME%$/      { getline; name=$0; next }
                /^%BASE%$/      { getline; base=$0; next }
                /^%VERSION%$/   { getline; ver=$0; next }
                /^%DESC%$/      { getline; desc=$0; next }
                /^%CSIZE%$/     { getline; csize=$0; next }
                /^%BUILDDATE%$/ { getline; bdate=$0; next }
                END { emit() }
              ' \
            | LC_ALL=C sort \
            | jq -R 'split("\t") | {
                name: .[0],
                base: .[1],
                version: .[2],
                description: .[3],
                size: (.[4] | tonumber),
                built: (.[5] | tonumber)
              }' \
            | jq -s '{packages: .}' \
            > packages.json

      - name: Stage site
        uses: ./.github/actions/stage-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/

  deploy:
    needs: repo
    if: ${{ !cancelled() && !failure() && needs.repo.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

