name: Build Arch Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

env:
  REPO_NAME: forge
  PAGES_URL: https://renownitall.github.io/forge

permissions: {}

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_packages: ${{ steps.set-matrix.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: set-matrix
        run: |
          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          if [ -z "$ALL_PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages found in repository"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              PACKAGES="$ALL_PACKAGES"
            else
              CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- packages/ | cut -d/ -f2 | sort -u)
              PACKAGES=""
              for pkg in $CHANGED; do
                if echo "$ALL_PACKAGES" | grep -qx "$pkg"; then
                  PACKAGES="$PACKAGES $pkg"
                fi
              done
            fi
          else
            PACKAGES="$ALL_PACKAGES"
          fi

          PACKAGES=$(echo "$PACKAGES" | xargs)

          if [ -z "$PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages to build"
          else
            JSON=$(echo "$PACKAGES" | tr ' ' '\n' | jq -R . | jq -sc '{package: .}')
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "Building: $PACKAGES"
          fi

  build:
    needs: changed-packages
    if: needs.changed-packages.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-packages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup build user
        run: |
          # Create user before caching to ensure correct directory ownership
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chown -R builder:builder /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chmod 700 /home/builder/.gnupg

      - name: Check if package needs Rust
        id: check-rust
        run: |
          # More precise regex to avoid false positives from comments/descriptions
          if grep -qE '^\s*(makedepends|depends)=.*rust' "packages/${{ matrix.package }}/PKGBUILD" || \
             grep -qE '^\s*build\(\).*cargo' "packages/${{ matrix.package }}/PKGBUILD"; then
            echo "needs_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pacman packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            pacman-${{ matrix.package }}-
            pacman-

      - name: Cache Rust/Cargo artifacts
        if: steps.check-rust.outputs.needs_rust == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cargo-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            cargo-${{ matrix.package }}-
            cargo-

      - name: Setup build environment
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --noprogressbar
          pacman -S --noconfirm --needed --noprogressbar git mold pacman-contrib

          sed -i 's/-march=x86-64 -mtune=generic/-march=x86-64-v3 -O3/g' /etc/makepkg.conf
          sed -i 's/!lto/lto/' /etc/makepkg.conf
          sed -i 's/ debug / !debug /' /etc/makepkg.conf

          NPROC=$(nproc)
          sed -i "s/#MAKEFLAGS=\"-j2\"/MAKEFLAGS=\"-j${NPROC}\"/" /etc/makepkg.conf

          cat >> /etc/makepkg.conf <<'EOF'
          RUSTFLAGS="-C target-cpu=x86-64-v3 -C opt-level=3 -C link-arg=-fuse-ld=mold"
          EOF

          sed -i "s/COMPRESSZST=(zstd -c -z -q -)/COMPRESSZST=(zstd -c -z -q --threads=0 -19 -)/" /etc/makepkg.conf

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: builder

      - name: Build ${{ matrix.package }}
        run: |
          cd "$GITHUB_WORKSPACE/packages/${{ matrix.package }}"
          su builder -c "makepkg -s --sign --noconfirm --noprogressbar --cleanbuild"

      - name: Verify package was built
        run: |
          ls packages/${{ matrix.package }}/*.pkg.tar.zst
          ls packages/${{ matrix.package }}/*.pkg.tar.zst.sig

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}/*.pkg.tar.zst
            packages/${{ matrix.package }}/*.pkg.tar.zst.sig
          if-no-files-found: error
          retention-days: 3

      - name: Clean pacman cache
        if: always()
        run: paccache -r -u -k 0 || true

  repo:
    needs: [changed-packages, build]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install repo tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          # devtools provides repo-add; pacman-contrib provides paccache
          pacman -Syu --noconfirm --noprogressbar devtools pacman-contrib

      - name: Setup GPG
        uses: ./.github/actions/setup-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          user: root

      - name: Download all package artifacts
        if: needs.changed-packages.outputs.has_packages == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/

      - name: Fetch existing repository packages
        run: |
          mkdir -p repo
          cp signing_key.asc repo/ 2>/dev/null || true

          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          debug_opted_in() {
            opts=$(tr -d '\n' < "packages/$1/PKGBUILD" \
              | grep -oE 'options\+?=\([^)]*\)' \
              | sed -E 's/^options\+?=//' \
              | tr -d "()'\"" | tr -s ' ')
            echo "$opts" | tr ' ' '\n' | grep -qx 'debug'
          }

          echo "Fetching existing repo file index from ${PAGES_URL}..."
          HTTP_CODE=$(curl -sSL --connect-timeout 15 --max-time 60 \
            -o /tmp/files.tar.gz -w '%{http_code}' \
            "${PAGES_URL}/${REPO_NAME}.files.tar.gz")

          : > /tmp/published.tsv
          if [ "$HTTP_CODE" = "200" ]; then
            tar -xzOzf /tmp/files.tar.gz --wildcards '*/desc' \
              | awk '
                  /^%FILENAME%$/ {
                    if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn
                    name=""; base=""; fn=""; getline; fn=$0; next
                  }
                  /^%NAME%$/     { getline; name=$0; next }
                  /^%BASE%$/     { getline; base=$0; next }
                  END            { if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn }
                ' | sort -u > /tmp/published.tsv
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "  No existing repo found at ${PAGES_URL} (first deploy?)."
          else
            echo "::error::Failed to fetch existing repo index (HTTP ${HTTP_CODE}); aborting to avoid wiping published packages"
            exit 1
          fi

          if [ -s /tmp/published.tsv ]; then
            while IFS=$'\t' read -r name base fn; do
              keep=1; reason=""
              if ! echo "$ALL_PACKAGES" | grep -qx "$base"; then
                keep=0; reason="base '${base}' no longer in packages/"
              elif [ -d "artifacts/$base" ]; then
                keep=0; reason="rebuilt this run, dropping previously published '${name}'"
              elif [ "$name" = "${base}-debug" ]; then
                if ! debug_opted_in "$base"; then
                  keep=0; reason="debug disabled globally, '${base}' does not opt in"
                fi
              fi
              if [ "$keep" != "1" ]; then
                echo "  Prune     $fn  ($reason)"
                continue
              fi
              [ -f "repo/$fn" ] && continue
              echo "  Fetching $fn..."
              curl -fsSL --connect-timeout 15 --max-time 120 \
                "${PAGES_URL}/${fn}"     -o "repo/$fn"     \
                || echo "    WARN: $fn missing on Pages, will be dropped from DB"
              curl -fsSL --connect-timeout 15 --max-time 30 \
                "${PAGES_URL}/${fn}.sig" -o "repo/$fn.sig" \
                || echo "    WARN: $fn.sig missing on Pages"
            done < /tmp/published.tsv
          fi

      - name: Build repository database
        run: |
          cd repo

          if [ -d ../artifacts ]; then
            find ../artifacts/ -name "*.pkg.tar.zst"     -exec mv {} . \;
            find ../artifacts/ -name "*.pkg.tar.zst.sig" -exec mv {} . \;
          fi

          shopt -s nullglob
          for f in *__EPOCH__*; do
            mv -- "$f" "${f//__EPOCH__/:}"
          done

          pkg_count=$(ls -1 *.pkg.tar.zst 2>/dev/null | wc -l)
          echo "Found ${pkg_count} package(s) total (existing + new):"
          ls -1 *.pkg.tar.zst | sed 's/^/  /'
          if [ "$pkg_count" -eq 0 ]; then
            echo "::error::No packages found to build repository"
            exit 1
          fi

          repo-add --remove --sign "${REPO_NAME}.db.tar.gz" *.pkg.tar.zst

          for link in "${REPO_NAME}.db" "${REPO_NAME}.db.sig" "${REPO_NAME}.files" "${REPO_NAME}.files.sig"; do
            if [ -L "$link" ]; then
              target=$(readlink "$link")
              rm "$link"
              cp "$target" "$link"
            fi
          done

          echo "Repository contents:"
          ls -lah

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: repo/

  deploy:
    needs: repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

