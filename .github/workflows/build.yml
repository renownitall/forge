name: Build Arch Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

env:
  REPO_NAME: forge
  PAGES_URL: https://renownitall.github.io/forge

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_packages: ${{ steps.set-matrix.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine changed packages
        id: set-matrix
        run: |
          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          if [ -z "$ALL_PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages found in repository"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              PACKAGES="$ALL_PACKAGES"
            else
              CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} -- packages/ | cut -d/ -f2 | sort -u)
              PACKAGES=""
              for pkg in $CHANGED; do
                if echo "$ALL_PACKAGES" | grep -qx "$pkg"; then
                  PACKAGES="$PACKAGES $pkg"
                fi
              done
            fi
          else
            PACKAGES="$ALL_PACKAGES"
          fi

          PACKAGES=$(echo "$PACKAGES" | xargs)

          if [ -z "$PACKAGES" ]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"package\":[]}" >> "$GITHUB_OUTPUT"
            echo "No packages to build"
          else
            JSON=$(echo "$PACKAGES" | tr ' ' '\n' | jq -R . | jq -sc '{package: .}')
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "Building: $PACKAGES"
          fi

  build:
    needs: changed-packages
    if: needs.changed-packages.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-packages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check if package needs Rust
        id: check-rust
        run: |
          if grep -qiE 'cargo|rust' "packages/${{ matrix.package }}/PKGBUILD"; then
            echo "needs_rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pacman packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            pacman-${{ matrix.package }}-
            pacman-

      - name: Cache Rust/Cargo artifacts
        if: steps.check-rust.outputs.needs_rust == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cargo-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package)) }}
          restore-keys: |
            cargo-${{ matrix.package }}-
            cargo-

      - name: Setup build environment
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --noprogressbar
          pacman -S --noconfirm --needed --noprogressbar git mold

          # x86-64-v3 with aggressive optimization
          sed -i 's/-march=x86-64 -mtune=generic/-march=x86-64-v3 -O3/g' /etc/makepkg.conf

          # Enable LTO
          sed -i 's/!lto/lto/' /etc/makepkg.conf

          # Do not produce split -debug packages for this binary repo.
          # Individual PKGBUILDs can still override this with options=('debug').
          sed -i 's/ debug / !debug /' /etc/makepkg.conf

          # Parallel compilation
          NPROC=$(nproc)
          sed -i "s/#MAKEFLAGS=\"-j2\"/MAKEFLAGS=\"-j${NPROC}\"/" /etc/makepkg.conf

          # Rust flags
          cat >> /etc/makepkg.conf <<'EOF'
          RUSTFLAGS="-C target-cpu=x86-64-v3 -C opt-level=3 -C link-arg=-fuse-ld=mold"
          EOF

          # Faster zstd compression with threading
          sed -i "s/COMPRESSZST=(zstd -c -z -q -)/COMPRESSZST=(zstd -c -z -q --threads=0 -19 -)/" /etc/makepkg.conf

          # Create non-root builder
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          mkdir -p /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chown -R builder:builder /home/builder/.cargo /home/builder/.gnupg /home/builder/.cache
          chmod 700 /home/builder/.gnupg

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          KEY_FILE=$(mktemp)
          PASS_FILE=$(mktemp)
          echo "$GPG_PRIVATE_KEY" > "$KEY_FILE"
          echo "$GPG_PASSPHRASE" > "$PASS_FILE"
          chmod 600 "$KEY_FILE" "$PASS_FILE"
          chown builder:builder "$KEY_FILE" "$PASS_FILE"

          # 1. Configure agent BEFORE doing anything else
          su builder -c "mkdir -p /home/builder/.gnupg && chmod 700 /home/builder/.gnupg"
          su builder -c "echo 'allow-preset-passphrase' > /home/builder/.gnupg/gpg-agent.conf"

          # 2. Import key (this auto-starts the agent reading the new config)
          su builder -c "gpg --batch --import $KEY_FILE"
          su builder -c "gpg-connect-agent reloadagent /bye"

          # 3. Preset the passphrase
          KEYGRIP=$(su builder -c "gpg --list-secret-keys --with-keygrip --with-colons" | awk -F: '/^grp/ {print $10; exit}')
          su builder -c "cat $PASS_FILE | /usr/lib/gnupg/gpg-preset-passphrase --preset $KEYGRIP"

          rm -f "$KEY_FILE" "$PASS_FILE"

      - name: Build ${{ matrix.package }}
        run: |
          cd "$GITHUB_WORKSPACE/packages/${{ matrix.package }}"
          su builder -c "makepkg -s --sign --noconfirm --noprogressbar --cleanbuild"

      - name: Verify package was built
        run: |
          ls packages/${{ matrix.package }}/*.pkg.tar.zst
          ls packages/${{ matrix.package }}/*.pkg.tar.zst.sig

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}/*.pkg.tar.zst
            packages/${{ matrix.package }}/*.pkg.tar.zst.sig
          if-no-files-found: error
          retention-days: 3

  repo:
    needs: [changed-packages, build]
    # Run unless a needed job actually failed. This lets the repo job proceed
    # when build was SKIPPED (e.g. a commit that only removes packages), so a
    # pure-removal push still prunes the published repo and redeploys. We do
    # NOT run when a build failed, to avoid publishing a partial repo.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install repo tools
        run: pacman -Syu --noconfirm --noprogressbar

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          KEY_FILE=$(mktemp)
          PASS_FILE=$(mktemp)
          echo "$GPG_PRIVATE_KEY" > "$KEY_FILE"
          echo "$GPG_PASSPHRASE" > "$PASS_FILE"
          chmod 600 "$KEY_FILE" "$PASS_FILE"

          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo 'allow-preset-passphrase' > ~/.gnupg/gpg-agent.conf

          gpg --batch --import "$KEY_FILE"
          gpg-connect-agent reloadagent /bye

          KEYGRIP=$(gpg --list-secret-keys --with-keygrip --with-colons | awk -F: '/^grp/ {print $10; exit}')
          cat "$PASS_FILE" | /usr/lib/gnupg/gpg-preset-passphrase --preset "$KEYGRIP"

          rm -f "$KEY_FILE" "$PASS_FILE"

      - name: Download all package artifacts
        # No artifacts exist when there is nothing to build (pure-removal push).
        if: needs.changed-packages.outputs.has_packages == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/

      - name: Fetch existing repository packages
        run: |
          mkdir -p repo
          cp signing_key.asc repo/

          # Current source package base directories. A published package is
          # retained only if its base is still defined here.
          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          # makepkg.conf globally disables debug symbols (!debug). A -debug
          # package is only expected when its PKGBUILD opts in. Returns true if
          # a bare 'debug' appears in any options=()/options+=() array.
          debug_opted_in() {
            opts=$(tr -d '\n' < "packages/$1/PKGBUILD" \
              | grep -oE 'options\+?=\([^)]*\)' \
              | sed -E 's/^options\+?=//' \
              | tr -d "()'\"" | tr -s ' ')
            echo "$opts" | tr ' ' '\n' | grep -qx 'debug'
          }

          # Pull the existing .files.tar.gz from the live Pages site so we can
          # enumerate which packages are already published. Without this step,
          # repo-add below would build a fresh DB containing only the artifacts
          # from this run, wiping every other package from the published repo.
          echo "Fetching existing repo file index from ${PAGES_URL}..."
          HTTP_CODE=$(curl -sSL --connect-timeout 15 --max-time 60 \
            -o /tmp/files.tar.gz -w '%{http_code}' \
            "${PAGES_URL}/${REPO_NAME}.files.tar.gz")
          # Clear the prune/keep list up front so a failed or first-deploy fetch
          # can never act on stale data from an earlier run.
          : > /tmp/published.tsv
          if [ "$HTTP_CODE" = "200" ]; then
            # Extract NAME, BASE and FILENAME for every package entry in the
            # published DB. Each desc member starts with %FILENAME%, so the
            # previous entry is flushed when the next one begins.
            tar -xzOzf /tmp/files.tar.gz --wildcards '*/desc' \
              | awk '
                  /^%FILENAME%$/ {
                    if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn
                    name=""; base=""; fn=""; getline; fn=$0; next
                  }
                  /^%NAME%$/     { getline; name=$0; next }
                  /^%BASE%$/     { getline; base=$0; next }
                  END            { if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn }
                ' | sort -u > /tmp/published.tsv
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "  No existing repo found at ${PAGES_URL} (first deploy?)."
          else
            echo "::error::Failed to fetch existing repo index (HTTP ${HTTP_CODE}); aborting to avoid wiping published packages"
            exit 1
          fi

          # Decide which published packages to retain, then fetch only those.
          # Every version of a package whose base is still in the source tree is
          # kept, so rebuilding or adding a package never prunes its older
          # predecessors or unrelated packages. We prune only:
          #   1. packages whose base was removed from packages/ (e.g. wl-screenrec)
          #   2. -debug packages, since debug symbols are globally disabled in
          #      makepkg.conf unless the PKGBUILD explicitly opts in.
          if [ -s /tmp/published.tsv ]; then
            while IFS=$'\t' read -r name base fn; do
              keep=1; reason=""
              if ! echo "$ALL_PACKAGES" | grep -qx "$base"; then
                keep=0; reason="base '${base}' no longer in packages/"
              elif [ "$name" = "${base}-debug" ]; then
                if ! debug_opted_in "$base"; then
                  keep=0; reason="debug disabled globally, '${base}' does not opt in"
                fi
              fi
              if [ "$keep" != "1" ]; then
                echo "  Prune     $fn  ($reason)"
                continue
              fi
              [ -f "repo/$fn" ] && continue
              echo "  Fetching $fn..."
              curl -fsSL --connect-timeout 15 --max-time 120 \
                "${PAGES_URL}/${fn}"     -o "repo/$fn"     \
                || echo "    WARN: $fn missing on Pages, will be dropped from DB"
              curl -fsSL --connect-timeout 15 --max-time 30 \
                "${PAGES_URL}/${fn}.sig" -o "repo/$fn.sig" \
                || echo "    WARN: $fn.sig missing on Pages"
            done < /tmp/published.tsv
          fi

      - name: Build repository database
        run: |
          cd repo

          # Move the freshly built artifacts into repo/ alongside the fetched ones.
          # artifacts/ is created by actions/download-artifact in the previous step,
          # relative to $GITHUB_WORKSPACE. It only exists when packages were built
          # this run; on a pure-removal run it is absent, so skip it.
          if [ -d ../artifacts ]; then
            find ../artifacts/ -name "*.pkg.tar.zst"     -exec mv {} . \;
            find ../artifacts/ -name "*.pkg.tar.zst.sig" -exec mv {} . \;
          fi

          pkg_count=$(ls -1 *.pkg.tar.zst 2>/dev/null | wc -l)
          echo "Found ${pkg_count} package(s) total (existing + new):"
          ls -1 *.pkg.tar.zst | sed 's/^/  /'
          if [ "$pkg_count" -eq 0 ]; then
            echo "::error::No packages found to build repository"
            exit 1
          fi

          # repo-add updates each matching entry in place when re-adding a
          # package that already exists in the DB, so rebuilt packages get
          # their metadata refreshed while all other entries are preserved.
          # --remove deletes DB entries whose .pkg.tar.zst file is missing
          # from disk — pruned packages were never fetched above, so their
          # entries (and files) are dropped, while kept predecessors remain.
          repo-add --remove --sign "${REPO_NAME}.db.tar.gz" *.pkg.tar.zst

          # Replace symlinks with copies for GitHub Pages
          for link in "${REPO_NAME}.db" "${REPO_NAME}.db.sig" "${REPO_NAME}.files" "${REPO_NAME}.files.sig"; do
            if [ -L "$link" ]; then
              target=$(readlink "$link")
              rm "$link"
              cp "$target" "$link"
            fi
          done

          echo "Repository contents:"
          ls -lah

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: repo/

  deploy:
    needs: repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

