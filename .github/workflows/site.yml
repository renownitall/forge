name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/site.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/actions/stage-site/**"
  workflow_dispatch:

env:
  REPO_NAME: forge
  PAGES_URL: https://renownitall.github.io/forge

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch existing repository packages
        uses: ./.github/actions/fetch-repo
        with:
          pages-url: ${{ env.PAGES_URL }}
          repo-name: ${{ env.REPO_NAME }}

      - name: Fetch existing database for site deploy
        run: |
          for f in "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db" "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files" "${REPO_NAME}.db.sig" "${REPO_NAME}.files.sig" "packages.json"; do
            echo "  Fetching $f..."
            curl -fsSL --connect-timeout 15 --max-time 30 \
              "${PAGES_URL}/$f" -o "repo/$f" \
              || echo "    WARN: $f not found on Pages (first deploy?)"
          done
          echo "Repository contents after fetch:"
          ls -lah repo/ || true

      - name: Stage site
        uses: ./.github/actions/stage-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/

  deploy:
    needs: site
    if: ${{ !cancelled() && !failure() && needs.site.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
