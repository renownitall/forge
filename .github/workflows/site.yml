name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

env:
  REPO_NAME: forge
  PAGES_URL: https://renownitall.github.io/forge

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch existing repository
        run: |
          mkdir -p repo
          cp signing_key.asc repo/

          ALL_PACKAGES=$(ls -d packages/*/PKGBUILD 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} || echo "")

          debug_opted_in() {
            opts=$(tr -d '\n' < "packages/$1/PKGBUILD" \
              | grep -oE 'options\+?=\([^)]*\)' \
              | sed -E 's/^options\+?=//' \
              | tr -d "()'\"" | tr -s ' ')
            echo "$opts" | tr ' ' '\n' | grep -qx 'debug'
          }

          echo "Fetching existing repo file index from ${PAGES_URL}..."
          HTTP_CODE=$(curl -sSL --connect-timeout 15 --max-time 60 \
            -o /tmp/files.tar.gz -w '%{http_code}' \
            "${PAGES_URL}/${REPO_NAME}.files.tar.gz")

          : > /tmp/published.tsv
          if [ "$HTTP_CODE" = "200" ]; then
            tar -xzOzf /tmp/files.tar.gz --wildcards '*/desc' \
              | awk '
                  /^%FILENAME%$/ {
                    if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn
                    name=""; base=""; fn=""; getline; fn=$0; next
                  }
                  /^%NAME%$/     { getline; name=$0; next }
                  /^%BASE%$/     { getline; base=$0; next }
                  END            { if (name != "" && base != "" && fn != "") print name "\t" base "\t" fn }
                ' | sort -u > /tmp/published.tsv
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "  No existing repo found at ${PAGES_URL} (first deploy?)."
          else
            echo "::error::Failed to fetch existing repo index (HTTP ${HTTP_CODE}); aborting to avoid wiping published packages"
            exit 1
          fi

          if [ -s /tmp/published.tsv ]; then
            while IFS=$'\t' read -r name base fn; do
              keep=1; reason=""
              if ! echo "$ALL_PACKAGES" | grep -qx "$base"; then
                keep=0; reason="base '${base}' no longer in packages/"
              elif [ "$name" = "${base}-debug" ]; then
                if ! debug_opted_in "$base"; then
                  keep=0; reason="debug disabled globally, '${base}' does not opt in"
                fi
              fi
              if [ "$keep" != "1" ]; then
                echo "  Prune     $fn  ($reason)"
                continue
              fi
              [ -f "repo/$fn" ] && continue
              echo "  Fetching $fn..."
              curl -fsSL --connect-timeout 15 --max-time 120 \
                "${PAGES_URL}/${fn}"     -o "repo/$fn"     \
                || echo "    WARN: $fn missing on Pages, will be dropped from DB"
              curl -fsSL --connect-timeout 15 --max-time 30 \
                "${PAGES_URL}/${fn}.sig" -o "repo/$fn.sig" \
                || echo "    WARN: $fn.sig missing on Pages"
            done < /tmp/published.tsv
          fi

          # Fetch existing database, files and manifest directly to avoid re-running repo-add
          for f in "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db" "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files" "${REPO_NAME}.db.sig" "${REPO_NAME}.files.sig" "packages.json"; do
            echo "  Fetching $f..."
            curl -fsSL --connect-timeout 15 --max-time 30 \
              "${PAGES_URL}/$f" -o "repo/$f" \
              || echo "    WARN: $f not found on Pages (first deploy?)"
          done

          echo "Repository contents after fetch:"
          ls -lah repo/ || true

      - name: Stage site
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          cp -R "$GITHUB_WORKSPACE/web/." repo/

          short_sha="${SHORT_SHA:0:7}"
          sed -i "s|styles.css|styles.css?v=${short_sha}|; s|app.js|app.js?v=${short_sha}|" repo/index.html
          sed -i "s|packages.json|packages.json?v=${short_sha}|" repo/app.js

          echo "Staged site contents:"
          ls -lah repo/
          grep -o 'styles.css?v=[a-f0-9]*' repo/index.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/

  deploy:
    needs: site
    if: ${{ !cancelled() && !failure() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
