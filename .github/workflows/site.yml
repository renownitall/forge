name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

env:
  REPO_NAME: forge
  PAGES_URL: https://renownitall.github.io/forge

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch existing repository packages
        uses: ./.github/actions/fetch-repo
        with:
          pages-url: ${{ env.PAGES_URL }}
          repo-name: ${{ env.REPO_NAME }}

      - name: Fetch existing database for site deploy
        run: |
          for f in "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db" "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files" "${REPO_NAME}.db.sig" "${REPO_NAME}.files.sig" "packages.json"; do
            echo "  Fetching $f..."
            curl -fsSL --connect-timeout 15 --max-time 30 \
              "${PAGES_URL}/$f" -o "repo/$f" \
              || echo "    WARN: $f not found on Pages (first deploy?)"
          done
          echo "Repository contents after fetch:"
          ls -lah repo/ || true

      - name: Stage site
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          cp -R "$GITHUB_WORKSPACE/web/." repo/

          short_sha="${SHORT_SHA:0:7}"
          sed -i "s|styles.css|styles.css?v=${short_sha}|; s|app.js|app.js?v=${short_sha}|" repo/index.html
          sed -i "s|packages.json|packages.json?v=${short_sha}|" repo/app.js

          echo "Staged site contents:"
          ls -lah repo/
          grep -o 'styles.css?v=[a-f0-9]*' repo/index.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo/

  deploy:
    needs: site
    if: ${{ !cancelled() && !failure() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
